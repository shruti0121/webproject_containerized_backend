name : deploy

on:
  push:
    branches:
      - main

jobs:  #what are actions job now ??
  Build-and-push: #name of the job is upto us we can choose the name that this action will perform 
    name: Build Docker image and push it to ECR  #human readable name will be shown in github action ui 
    runs-on: ubuntu-latest

    permissions : 
      id-token: write  #Allow this GitHub Actions workflow to create an OIDC identity token 
      contents: read  #Allow the workflow to read the repository contents.
    #now job is made up of steps and steps run in order if step 2 fails step 3 does not run 

    steps: 
      - name: checkout repository version v2 owner actions 
        uses: actions/checkout@v4 #run a pre built GHithub action and download the repo on the ubuntu   server initially it is only on github repo, now we can install packages and stuff 


      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::882885365745:role/IAM_GITHUB_CONTAINRIZED_BACKEND
          role-session-name: GitHub-Action-Role
          aws-region: us-east-1

          # Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

       # Build Docker image  this actually builds image from dockerfile
      - name: Build Docker image       #here docker builds image with repo name backend: <tagname> if not given it chooses latest itself like here  -t means tag here 
        run: |
         docker build -t backend:${{ github.sha }}  .         

      # Tag image   it takes the existing image from above  and tag it for ecr 
      - name: Tag Docker image   #this gives the same image diff name now we have 
        run: |
          docker tag backend:${{ github.sha }}  \
          882885365745.dkr.ecr.us-east-1.amazonaws.com/backend:${{ github.sha }}    
         

      # Push image
      - name: Push Docker image to ECR
        run: |
          docker push \
          882885365745.dkr.ecr.us-east-1.amazonaws.com/backend:${{ github.sha }}

      - name: Update task definition image
        run: |
            sed -i "s|IMAGE_TAG|${{ github.sha }}|g" task-definition.json


      # now the already running containers do not pull new images by default only new running ocntainers will so in order to make sure the already running containers pulls new image we run this force deployment
      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-definition.json
          service: Ricemill_ECS_service
          cluster: WebProjectContainerizedStack-ClusterEB0386A7-IMjUNlVMYUrc
          wait-for-service-stability: true

      #now we have cloudformation template next we need permission to aws to deploy these 








